name: Plugin

on:
  pull_request:
    paths:
      - ".github/workflows/plugin.yml"
      - "bun.lock"
      - "package.json"
      - "packages/better-translation/**"
      - "tooling/**"
      - "vite.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/plugin.yml"
      - "bun.lock"
      - "package.json"
      - "packages/better-translation/**"
      - "tooling/**"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Vite plugin behavior
        run: |
          bun test \
            packages/better-translation/test/source-analysis.test.ts \
            packages/better-translation/test/vite-plugin.test.ts \
            packages/better-translation/test/performance.test.ts

      - name: Test Vite plugin configuration types
        run: bunx tsc -p packages/better-translation/tsconfig.vite-plugin-test.json
