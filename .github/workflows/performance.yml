name: Performance

on:
  pull_request:
    paths:
      - ".github/workflows/performance.yml"
      - "bun.lock"
      - "package.json"
      - "packages/better-translation/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/performance.yml"
      - "bun.lock"
      - "package.json"
      - "packages/better-translation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest

    steps:
      - name: Check out current revision
        uses: actions/checkout@v7
        with:
          path: current

      - name: Check out pull request base
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v7
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install current dependencies
        working-directory: current
        run: bun install --frozen-lockfile

      - name: Install baseline dependencies
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Benchmark current revision
        working-directory: current
        run: bun run bench:performance:json > ../performance-current.json

      - name: Benchmark pull request base
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: baseline
        run: bun run bench:performance:json > ../performance-base.json

      - name: Compare pull request performance
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: current
        run: |
          set -o pipefail
          bun run bench:performance:compare -- \
            --base ../performance-base.json \
            --current ../performance-current.json \
            | tee ../performance-comparison.md
          cat ../performance-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compiler-performance-${{ github.sha }}
          path: |
            performance-base.json
            performance-current.json
            performance-comparison.md
