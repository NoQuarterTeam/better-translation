name: Performance

on:
  pull_request:
    paths:
      - ".github/workflows/performance.yml"
      - "bun.lock"
      - "package.json"
      - "packages/better-translation/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/performance.yml"
      - "bun.lock"
      - "package.json"
      - "packages/better-translation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Check out current revision
        uses: actions/checkout@v7
        with:
          path: current

      - name: Check out base revision
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          path: baseline
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install current dependencies
        working-directory: current
        run: bun install --frozen-lockfile

      - name: Install baseline dependencies
        if: ${{ github.event_name != 'workflow_dispatch' }}
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Guard current scaling behavior
        working-directory: current
        run: bun run bench:performance:guard

      - name: Benchmark current revision
        working-directory: current
        run: bun run bench:performance:json > ../performance-current.json

      - name: Benchmark base revision
        if: ${{ github.event_name != 'workflow_dispatch' }}
        working-directory: baseline
        run: bun run bench:performance:json > ../performance-base.json

      - name: Compare performance
        if: ${{ github.event_name != 'workflow_dispatch' }}
        working-directory: current
        run: |
          set -o pipefail
          bun run bench:performance:compare -- \
            --base ../performance-base.json \
            --current ../performance-current.json \
            | tee ../performance-comparison.md
          cat ../performance-comparison.md >> "$GITHUB_STEP_SUMMARY"
